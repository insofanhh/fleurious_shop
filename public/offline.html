<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4eade" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Một chút chờ đợi · Fleurious</title>
    <style>
      @font-face {
        font-family: "Lora";
        src: url("/fonts/Lora-Regular.ttf") format("truetype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("/fonts/BeVietnamPro-Regular.ttf") format("truetype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: #f4eade;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(32px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(32px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background: #f4eade;
        color: #6e1423;
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 560px);
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
      }
      .brand img {
        display: block;
        width: 40px;
        height: 54px;
        object-fit: contain;
      }
      .brand span {
        font-family: "Lora", Georgia, serif;
        font-size: 30px;
        letter-spacing: -0.05em;
        line-height: 1.3;
      }
      .connection-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: #796660;
        font-size: 11px;
        line-height: 1.6;
      }
      h1 {
        margin: 18px 0 22px;
        font-family: "Lora", Georgia, serif;
        font-size: clamp(28px, 5.7vw, 42px);
        font-weight: 400;
        line-height: 1.4;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      h1 span {
        display: block;
      }
      p {
        max-width: 440px;
        margin: 0 auto;
        color: #796660;
        font-size: 14px;
        line-height: 1.9;
        text-wrap: pretty;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 50px;
        max-width: 100%;
        margin-top: 28px;
        padding: 14px 24px;
        border: 1px solid #6e1423;
        border-radius: 999px;
        background: #6e1423;
        color: #fbf7f1;
        font: inherit;
        line-height: 1.5;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      button:hover {
        background: #4d101b;
      }
      button:focus-visible {
        outline: 2px solid #6e1423;
        outline-offset: 4px;
      }
      svg {
        flex-shrink: 0;
      }
      @media (max-width: 360px) {
        .brand {
          margin-bottom: 24px;
        }
        .brand span {
          font-size: 27px;
        }
        p {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="Fleurious">
        <img src="/logo.svg" width="40" height="54" alt="" />
        <span aria-hidden="true">fleurious.</span>
      </div>
      <div class="connection-status">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="m2 2 20 20M8.5 16.5a5 5 0 0 1 7 0M12 20h.01M5 12a10 10 0 0 1 4-2m6.5.5A10 10 0 0 1 19 12M2 7.5A16 16 0 0 1 5 6m4-1a16 16 0 0 1 13 2.5"
          />
        </svg>
        Bạn đang ngoại tuyến
      </div>
      <h1><span>Hoa vẫn ở đây.</span><span>Chờ bạn kết nối lại.</span></h1>
      <p>
        Giỏ hoa nháp được giữ trên thiết bị. Vui lòng kết nối mạng để đặt hoa,
        thanh toán và kiểm tra thông tin đơn hàng.
      </p>
      <button type="button" onclick="location.reload()">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1.5L20 8M4 16l2.3 2.5A7 7 0 0 0 17.9 17"
          />
        </svg>
        Thử kết nối lại
      </button>
    </main>
  </body>
</html>
